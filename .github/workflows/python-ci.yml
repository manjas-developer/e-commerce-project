name: Python Code Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code 📥
      uses: actions/checkout@v4

    - name: Set up Python 🐍
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Verify Python Syntax 🔍
      run: |
        python -m py_compile main.py
